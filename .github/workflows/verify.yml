name: verify

on:
  push:
    branches: [main]
  pull_request:

# This repo is public and holds no secrets, which is the point. Nothing here
# needs credentials, and the workflow is given none — read-only on contents so
# a compromised action in the dependency tree cannot push.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan asks git what it would publish, so it needs more
          # than the default shallow tip to be asking about anything real.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `ci`, not `install`: it installs exactly what package-lock.json pins
      # and fails if the lockfile and package.json disagree, rather than
      # quietly resolving something newer than what was tested.
      - run: npm ci

      # ONE ENTRY POINT, ON PURPOSE — and this used to list the checks
      # individually, which is exactly the drift it now avoids. `verify` gained
      # the ban-rule and xp-curve contract checks and this workflow did not, so
      # for a while CI was greener than the repo. Both of those pin a rule that
      # exists twice (once here, once in Lua), which is precisely the kind of
      # check that must not quietly stop running.
      #
      # THAT IS ALSO WHAT MAKES IT CHEAP TO MAINTAIN: adding a check means
      # adding it to `npm run verify`, and this file does not change.
      #
      # Secret scanning runs first inside it, which is right — it is the
      # cheapest check and the only one whose failure is urgent. Everything else
      # can be fixed at leisure; a committed credential cannot be uncommitted.
      - run: npm run verify

      # NO ENVIRONMENT IS SUPPLIED, AND THIS IS THE GATE THAT PROVES IT WORKS.
      #
      # `next build` imports every module to collect page data, so anything
      # reading env() at module scope makes the build demand a complete
      # production environment — a real Discord secret, a real signing key —
      # and it can then only run on an already-configured host. CI has no
      # secrets by design, so CI could never build it.
      #
      # This step failed on a real box for exactly that reason after the fix
      # was reverted as unnecessary. It was "unnecessary" because the local
      # test that cleared it was wrong: Next loads `.env.local` from disk
      # automatically, so unsetting shell variables proved nothing. CI has no
      # such file, which is what makes this the honest check.
      - run: npx next build
